[build]
  # Static site — no bundler. The build step just copies the site files into a
  # fresh `dist/` folder. Wiping `dist/` first guarantees a stale build left over
  # from the old React/Vite version of the site can never be published again.
  command = "rm -rf dist && mkdir -p dist && cp -r index.html styles.css script.js assets dist/"
  publish = "dist"
